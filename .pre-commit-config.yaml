repos:
  - repo: local
    hooks:
      - id: cargo_fmt
        name: cargo fmt
        language: system
        # Every crate, whichever .rs files are staged: `cargo fmt` in core/ doesn't reach
        # core/dev (outside its workspace), and all of them together take under a second.
        entry: |
          bash -c '
          git ls-files "*Cargo.toml" | while read -r MANIFEST; do
            (cd "$(dirname "$MANIFEST")" && cargo fmt) || exit 1;
          done
          '
        pass_filenames: false
        types: [rust]
        files: \.rs$
      - id: prettier
        name: prettier
        language: system
        files: ^.*$
        types_or: [javascript, jsx, ts, tsx]
        entry: bash -c "yarn pretty-quick --staged"

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.8.0
    hooks:
      - id: golangci-lint
        entry: bash -c 'cd backend && golangci-lint run --timeout=5m --config ../.golangcli.yml'
