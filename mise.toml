# Dev tools for this repo: `mise install` from the repo root (https://mise.jdx.dev).
# Rust stays on rustup (latest stable, like CI). LiveKit for local calls: `brew install livekit`.
[tools]
# Yarn 4.9.2 bundles got 11.8.2, whose race can crash `yarn install` with an `onCancel` error when
# registry requests time out or retry (yarnpkg/berry#7245): reported on Node 24.20+ and 26, depends
# on network timing, fixed in Yarn 4.18.1.
node = "24.22.2"         # .nvmrc; Brotli fix (CVE-2026-111497) is in 24.22.1 and later
go = "1.25"              # backend/go.mod, CI
task = "3"               # Taskfile.yml
golangci-lint = "2.8.0"  # .pre-commit-config.yaml
gh = "2"                 # packaging/dataico/release.sh (GitHub releases)
