name: Backend Go CI

on:
  workflow_call:

jobs:
  test-backend-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: backend
        run: |
          go mod download

      # Unit tests under internal/ plus the integration tests (in-memory SQLite and
      # miniredis, no services needed).
      - name: Run tests
        working-directory: backend
        run: go test -tags=integration ./... -v
