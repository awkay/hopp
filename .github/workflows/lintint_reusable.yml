name: pre-commit

on:
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # `tauri build` refuses an @tauri-apps/* npm package whose major.minor differs from its
      # crate, and no CI job runs `tauri build`. Reads only the lockfiles, so it needs no install,
      # and it runs here because this job has no path filter (npm-only changes skip tauri-rust).
      - name: Check Tauri npm and crate versions pair up
        run: node scripts/check-tauri-versions.mjs
      - name: Install dependencies
        run: yarn install
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: pre-commit/action@v3.0.1
