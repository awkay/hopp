name: Publish Dataico Backend Image

# Builds the backend image (with the web app injected) for our self-hosted server and
# pushes it to ghcr.io/<owner>/hopp-backend. arm64 only: the host is Graviton (c7g).
# Deploy by setting hoppImage in the infra repo (lib/config.ts) to the printed tag.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web-app/**"
      - ".github/workflows/publish-dataico-backend.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Install workspace deps
        run: yarn install --immutable

      - name: Build web-app
        run: yarn workspace web-app build
        env:
          VITE_DISABLE_TELEMETRY: "true"

      - name: Inject web-app into backend
        run: web-app/scripts/inject-to-backend.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hopp-backend"
          TAG="dataico-${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:${TAG},${IMAGE}:dataico-latest" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
