name: Tauri rust CI

on:
  workflow_call:

jobs:
  check-files:
    runs-on: ubuntu-latest
    outputs:
      tauri-changed: ${{ steps.filter.outputs.tauri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check for changes in tauri/src-tauri
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.workflow_run.base_sha }}
          filters: |
            tauri:
              - 'tauri/src-tauri/**'
      - run: |
          echo "Last commit:"
          git --no-pager log --decorate=short --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' -n1

  fmt:
    runs-on: ubuntu-latest
    needs: check-files
    if: ${{ needs.check-files.outputs.tauri-changed == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Run rustfmt
        working-directory: tauri/src-tauri
        run: cargo fmt --all -- --check

  lint:
    name: Lint (clippy)
    runs-on: ${{ matrix.os }}
    needs: check-files
    if: ${{ needs.check-files.outputs.tauri-changed == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin

    env:
      SENTRY_DSN_RUST: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          toolchain: "1.96.1"
          components: clippy

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Create dist
        working-directory: tauri
        shell: bash
        run: |
          mkdir -p dist

      - name: Create hopp_core debug
        working-directory: core
        shell: bash
        run: |
          mkdir -p target/debug
          touch target/debug/hopp_core-${{ matrix.target }}

      - name: Run clippy
        working-directory: tauri/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check-files
    if: ${{ needs.check-files.outputs.tauri-changed == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin

    env:
      SENTRY_DSN_RUST: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Rust
        run: |
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Create hopp_core debug
        working-directory: core
        shell: bash
        run: |
          mkdir -p target/debug
          touch target/debug/hopp_core-${{ matrix.target }}

      - name: Build
        working-directory: tauri/src-tauri
        run: cargo build --release --target ${{ matrix.target }}
